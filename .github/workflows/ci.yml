name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm install

      - name: Validate Commit Messages (Push / Dispatch)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npx commitlint --last --verbose

      - name: Validate PR Commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lint-and-format:
    name: Code Formatting & Linting (Clippy)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Code Formatting
        run: cargo fmt -- --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets -- -D warnings

  test-and-build:
    name: Build & Test (Windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain (Stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Unit & Integration Tests
        run: cargo test --verbose

      - name: Compile Optimized Release Binary
        run: cargo build --release --verbose

      - name: Prepare Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-package" -Force | Out-Null
          Copy-Item "target/release/musicpresence.exe" "release-package/AppleMusicPresence.exe"
          Copy-Item "config.toml" "release-package/config.toml"
          Copy-Item "README.md" "release-package/README.md"
          
          Compress-Archive -Path "release-package/*" -DestinationPath "AppleMusicPresence-windows-x64.zip" -Force
          Copy-Item "target/release/musicpresence.exe" "AppleMusicPresence.exe"

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            AppleMusicPresence.exe
            AppleMusicPresence-windows-x64.zip
          if-no-files-found: error

  release:
    name: Run Semantic Release (Main -> Stable, Develop -> Beta)
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: [commitlint, lint-and-format, test-and-build]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm install

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: ./

      - name: Execute Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
