name: CD - Production Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-production-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  semantic-release-and-publish:
    name: Semantic Versioning, Changelog & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust Toolchain (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --verbose

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Determine Next Semantic Version
        id: semver
        shell: bash
        run: |
          RAW_VER=$(git-cliff --bumped-version 2>/dev/null || true)
          if [ -z "$RAW_VER" ]; then
            echo "No bump computed from git-cliff, using Cargo.toml version."
            CURRENT_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
            NEXT_TAG="v$CURRENT_VER"
            NEXT_VER="$CURRENT_VER"
          else
            NEXT_TAG="$RAW_VER"
            NEXT_VER="${RAW_VER#v}"
          fi
          
          echo "Next version: $NEXT_VER (Tag: $NEXT_TAG)"
          echo "version=$NEXT_VER" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml & CHANGELOG.md
        shell: bash
        run: |
          VER="${{ steps.semver.outputs.version }}"
          TAG="${{ steps.semver.outputs.tag }}"
          
          # Update version in Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$VER\"/" Cargo.toml
          
          # Generate CHANGELOG.md and release notes
          git-cliff --tag "$TAG" --output CHANGELOG.md 2>/dev/null || git-cliff --unreleased --output CHANGELOG.md
          git-cliff --tag "$TAG" --latest --strip header --output RELEASE_NOTES.md 2>/dev/null || git-cliff --unreleased --strip header --output RELEASE_NOTES.md

      - name: Compile Optimized Release Binary
        run: cargo build --release --verbose

      - name: Prepare Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-package" -Force | Out-Null
          Copy-Item "target/release/MusicPresence.exe" "release-package/MusicPresence.exe"
          Copy-Item "config.toml" "release-package/config.toml"
          Copy-Item "README.md" "release-package/README.md"
          Copy-Item "CHANGELOG.md" "release-package/CHANGELOG.md"
          
          Compress-Archive -Path "release-package/*" -DestinationPath "MusicPresence-windows-x64.zip" -Force
          Copy-Item "target/release/MusicPresence.exe" "MusicPresence.exe"

      - name: Commit & Push Version Bump and Changelog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          TAG="${{ steps.semver.outputs.tag }}"
          
          git add Cargo.toml Cargo.lock CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $TAG [skip ci]"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin main --follow-tags
          else
            # Ensure tag exists if no file changes needed
            git tag "$TAG" 2>/dev/null || true
            git push origin "$TAG" 2>/dev/null || true
          fi

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: "MusicPresence ${{ steps.semver.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          prerelease: false
          make_latest: true
          files: |
            MusicPresence.exe
            MusicPresence-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
